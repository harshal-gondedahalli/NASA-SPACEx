<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1720">
<title>Gravity Playground · Space BOYZ</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f3f7fb;background:#05090e}
body{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 50% 0%,#172a38 0,#0b151e 48%,#05090e 100%)}
main{width:min(620px,100%);padding:26px 24px 24px;border:1px solid #344652;border-radius:25px;background:linear-gradient(145deg,rgba(17,31,41,.98),rgba(10,21,30,.98));box-shadow:0 24px 80px #0009}
.logo{font-size:34px;line-height:1;margin:0 0 20px}
.eyebrow{margin:0 0 14px;color:#b8d9c7;font-size:10px;letter-spacing:.2em;font-weight:800}
h1{margin:0 0 24px;font-size:clamp(24px,5vw,32px);line-height:1.1;letter-spacing:-.035em;color:#f4f7fb}
.intro{margin:0 0 12px;color:#aebdc6;font-size:14px;line-height:1.45}
.actions{display:grid;grid-template-columns:1fr;gap:8px}
.action{min-height:42px;display:flex;align-items:center;justify-content:center;padding:11px 16px;border:1px solid #2b4147;border-radius:12px;color:#fff;text-align:center;text-decoration:none;font-size:13px;font-weight:850;background:#172a2e;transition:transform .18s,filter .18s,border-color .18s}
.action.secondary{border-color:#3c8db4;background:linear-gradient(105deg,#268bb4,#5146bd)}
.action:hover,.action:focus-visible{transform:translateY(-2px);filter:brightness(1.12);outline:none;border-color:#9bc9ba}
@media(max-width:420px){body{padding:12px}main{padding:24px 18px 20px}}
</style>
</head>
<body>
<main>
<div class="logo" aria-hidden="true">🌙</div>
<div class="eyebrow">BONUS LAB · SCIENCE</div>
<h1>Gravity Playground</h1>
<p class="intro">Compare gravity on different worlds and calculate a rover’s simulated weight.</p>
<nav class="actions" aria-label="Gravity Playground options">
<a class="action" href="https://hrashal-gondedahalli.github.io/NASA-SPACEx/gravity-playground/galaxy-lab/">Open Gravity Playground →</a>
<a class="action secondary" href="https://hrashal-gondedahalli.github.io/NASA-SPACEx/mark-16/">More adventures ↗</a>
</nav>
</main>
</body>
</html>
